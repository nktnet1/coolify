# documentation: https://www.rybbit.io/docs
# slogan: An open-source vector database designed for high-performance similarity search and storage of embeddings.
# tags: analytics, insights, privacy
# logo: svgs/rybbit.png
# port: 80
services:
  rybbit_backend:
    image: 'ghcr.io/rybbit-io/rybbit-backend:v1.3.0'
    environment:
      - NODE_ENV=production
      - 'CLICKHOUSE_HOST=http://rybbit_clickhouse:8123'
      - 'CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}'
      - 'CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}'
      - 'CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_64_CLICKHOUSE}'
      - POSTGRES_HOST=rybbit_postgres
      - POSTGRES_PORT=5432
      - 'POSTGRES_DB=${POSTGRES_DB:-analytics}'
      - 'POSTGRES_USER=${POSTGRES_USER:-frog}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}'
      - 'BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_BETTERAUTH}'
      - 'BASE_URL=https://${DOMAIN}'
      - 'DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}'
    depends_on:
      rybbit_clickhouse:
        condition: service_healthy
      rybbit_postgres:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://127.0.0.1:3001/api/health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  rybbit_client:
    image: 'ghcr.io/rybbit-io/rybbit-client:v1.3.0'
    environment:
      - NODE_ENV=production
      - 'NEXT_PUBLIC_BACKEND_URL=https://${DOMAIN}'
      - 'NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP}'
    depends_on:
      - rybbit_backend
    restart: unless-stopped
    exclude_from_hc: true
  rybbit_caddy:
    image: 'caddy:2-alpine'
    environment:
      - 'DOMAIN=${DOMAIN}'
    restart: unless-stopped
    exclude_from_hc: true
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        content: ":80 {\n  route {\n    reverse_proxy /api/* http://rybbit_backend:3001 {\n      header_up Host {http.reverse_proxy.upstream.hostport}\n      header_up X-Real-IP {http.request.header.X-Real-IP}\n    }\n    reverse_proxy http://rybbit_client:3002 {\n      header_up Host {http.reverse_proxy.upstream.hostport}\n      header_up X-Real-IP {http.request.header.X-Real-IP}\n    }\n  }\n}\n"
  rybbit_postgres:
    image: 'postgres:17.5'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-analytics}'
      - 'POSTGRES_USER=${POSTGRES_USER:-frog}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  rybbit_clickhouse:
    image: 'clickhouse/clickhouse-server:25.5'
    environment:
      - 'CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}'
      - 'CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}'
      - 'CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_64_CLICKHOUSE}'
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://localhost:8123/ping'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - 'clickhouse_data:/var/lib/clickhouse'
      - type: bind
        source: ./clickhouse_config/enable_json.xml
        target: /etc/clickhouse-server/config.d/enable_json.xml
        content: "<clickhouse>\n    <settings>\n        <enable_json_type>1</enable_json_type>\n    </settings>\n</clickhouse>\n"
      - type: bind
        source: ./clickhouse_config/logging_rules.xml
        target: /etc/clickhouse-server/config.d/logging_rules.xml
        content: "<clickhouse>\n    <logger>\n        <level>warning</level>\n        <console>true</console>\n    </logger>\n    <query_thread_log remove=\"remove\"/>\n    <query_log remove=\"remove\"/>\n    <text_log remove=\"remove\"/>\n    <trace_log remove=\"remove\"/>\n    <metric_log remove=\"remove\"/>\n    <asynchronous_metric_log remove=\"remove\"/>\n    <session_log remove=\"remove\"/>\n    <part_log remove=\"remove\"/>\n    <latency_log remove=\"remove\"/>\n    <processors_profile_log remove=\"remove\"/>\n</clickhouse>"
      - type: bind
        source: ./clickhouse_config/network.xml
        target: /etc/clickhouse-server/config.d/network.xml
        content: "<clickhouse>\n    <listen_host>0.0.0.0</listen_host>\n</clickhouse>\n"
      - type: bind
        source: ./clickhouse_config/user_logging.xml
        target: /etc/clickhouse-server/config.d/user_logging.xml
        content: "<clickhouse>\n    <profiles>\n        <default>\n            <log_queries>0</log_queries>\n            <log_query_threads>0</log_query_threads>\n            <log_processors_profiles>0</log_processors_profiles>\n        </default>\n    </profiles>\n</clickhouse>"
